<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: necesario para respetar el notch en iOS.
      interactive-widget=resizes-content: en Android el teclado achica la
      pagina en vez de taparla, asi las hojas (opinar, reservar) dejan ver lo
      que se escribe y el boton de enviar.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#10402a" />
    <meta
      name="description"
      content="Mira dónde viene el bus eléctrico de Jalapa y cuántos faltan para que salga."
    />
    <title>Mi Bus Jalapa — Bus eléctrico municipal</title>

    <!-- Icono del sitio (HU-87). El SVG cubre pestañas y accesos directos; los
         PNG salen del mismo simbolo para Android (manifest) y para iOS. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!--
      Pantalla de carga (HU-87). Vive dentro de #raiz: el navegador la pinta
      apenas llega el HTML, antes de que baje el JavaScript, y React la
      reemplaza al montar. Estilos en linea a proposito: no dependen de ningun
      archivo que todavia este en camino ni de fuentes externas. Colores del
      canvas de diseño (tema.css). Solo animan opacity (DESIGN.md §12).
    -->
    <style>
      body {
        margin: 0;
        background: #10402a;
      }
      .pantalla-de-carga {
        position: relative;
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px 24px 96px;
        background: #10402a;
        color: #fbf7f0;
        text-align: center;
        font-family: 'Public Sans Variable', 'Public Sans', system-ui, -apple-system,
          'Segoe UI', Roboto, sans-serif;
      }
      .pantalla-de-carga__simbolo {
        width: 88px;
        height: 88px;
        margin-bottom: 12px;
      }
      .pantalla-de-carga__nombre {
        margin: 0;
        font-family: 'Archivo Variable', Archivo, system-ui, -apple-system, 'Segoe UI',
          Roboto, sans-serif;
        font-size: 40px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .pantalla-de-carga__lema {
        margin: 0;
        font-size: 15px;
        line-height: 22px;
        color: #f2b705;
      }
      .pantalla-de-carga__estado,
      .pantalla-de-carga__aviso {
        margin: 24px 0 0;
        max-width: 280px;
        font-size: 15px;
        line-height: 22px;
        color: #cbded1;
      }
      .pantalla-de-carga__estado {
        animation: pantalla-de-carga-latido 1.6s ease-in-out infinite;
      }
      .pantalla-de-carga__volcanes {
        position: absolute;
        left: 50%;
        bottom: 32px;
        width: 210px;
        height: 58px;
        transform: translateX(-50%);
      }
      @keyframes pantalla-de-carga-latido {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pantalla-de-carga__estado {
          animation: none;
        }
      }
    </style>
    <noscript>
      <style>
        .pantalla-de-carga__estado {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="raiz">
      <div class="pantalla-de-carga" role="status" aria-live="polite">
        <svg
          class="pantalla-de-carga__simbolo"
          viewBox="0 0 512 512"
          aria-hidden="true"
          focusable="false"
        >
          <path fill="#fbf7f0" fill-rule="evenodd" d="M400 0 97 1 69 9 44 23 33 33 15 56 4 83 0 112 0 400 4 429 9 443 23 468 44 489 69 503 83 508 112 512 415 511 443 503 468 489 479 479 497 456 508 429 512 400 512 112 508 83 503 69 489 44 468 23 443 9 429 4Z" />
          <path fill="#10402a" fill-rule="evenodd" d="M103 158 96 162 91 167 87 175 86 181 86 301 89 311 98 319 104 322 114 322 117 306 126 293 140 284 156 280 172 284 186 293 195 306 198 322 324 322 327 306 333 297 340 289 355 282 366 280 382 284 396 293 405 306 408 322 419 316 424 307 426 298 425 238 393 171 385 162 377 158 371 158ZM165 186 170 189 172 194 172 234 170 240 166 243 162 244 117 243 112 240 110 235 110 196 112 189 116 186 120 186ZM245 186 250 189 252 194 252 234 249 241 242 244 191 243 186 240 184 235 184 196 187 188 194 186ZM379 186 384 187 388 191 406 230 406 235 404 239 397 243 340 243 334 241 330 235 330 196 331 190 335 187 339 186ZM309 186 314 189 316 196 316 290 312 295 307 297 273 297 268 294 266 288 266 193 270 188 275 186ZM251 292 245 301 236 306 226 308 216 306 207 301 201 292 199 282 201 271 207 262 216 257 226 254 236 257 245 262 251 271 253 282ZM181 303 172 295 160 291 148 292 137 297 128 306 124 318 125 331 131 342 140 350 152 354 164 353 175 348 184 338 188 327 187 314ZM165 329 157 333 149 331 145 324 147 316 155 312 163 314 167 321ZM391 303 382 295 370 291 358 292 347 297 338 306 334 318 335 331 341 342 350 350 362 354 374 353 385 348 394 338 398 327 397 314ZM375 329 367 333 359 331 355 324 357 316 365 312 373 314 377 321ZM230 262 229 262 216 284 225 285 222 301 223 301 236 279 227 278Z" />
        </svg>
        <p class="pantalla-de-carga__nombre">Mi Bus Jalapa</p>
        <p class="pantalla-de-carga__lema">Bus eléctrico · Jalapa</p>
        <p class="pantalla-de-carga__estado">Cargando…</p>
        <noscript>
          <p class="pantalla-de-carga__aviso">
            Mi Bus Jalapa necesita JavaScript para mostrar dónde va el bus. Actívalo e intenta de
            nuevo.
          </p>
        </noscript>
        <svg
          class="pantalla-de-carga__volcanes"
          viewBox="0 0 210 58"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M0 58 L46 12 L74 40 L102 16 L132 46 L160 18 L210 58 Z" fill="#f2b705" opacity=".92" />
        </svg>
      </div>
    </div>

    <!-- Si la app no llega a montar (red muy lenta, JavaScript bloqueado), la
         pantalla no se queda diciendo "Cargando…" para siempre. Cuando React
         monta, ".pantalla-de-carga__estado" ya no existe y esto no hace nada. -->
    <script>
      window.setTimeout(function () {
        var estado = document.querySelector('.pantalla-de-carga__estado');
        if (estado) {
          estado.textContent =
            'Está tardando más de lo normal: revisa tu conexión y vuelve a abrir la página.';
        }
      }, 20000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
