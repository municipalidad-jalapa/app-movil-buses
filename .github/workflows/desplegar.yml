name: Build y despliegue

# Reemplaza a docker-build-push-qa / -production y deploy-qa de GitLab CI.
#
# La lista de variables obligatorias sale de UNA sola fuente
# (vars.VITE_REQUIRED_BUILD_ARGS, variable del repo) en vez de estar
# duplicada en cada job como en GitLab. Esa duplicacion fue justamente la
# causa de que QA se desplegara dos veces con la pantalla en negro: se
# agregaba la variable a un job y se olvidaba en el otro.

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # QA vive en el servidor de Lightsail (namespace qa): https://qa.mibusjalapa.lat
  qa:
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    uses: municipalidad-jalapa/pipeline-templates/.github/workflows/docker-build-ghcr.yml@main
    with:
      image-name: frontend-app-buses
      environment: qa
      required-build-args: ${{ vars.VITE_REQUIRED_BUILD_ARGS }}
    secrets: inherit

  # Un solo job: construye, publica y despliega. El environment production pide una aprobacion.
  produccion:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: municipalidad-jalapa/pipeline-templates/.github/workflows/docker-build-ghcr.yml@main
    with:
      image-name: frontend-app-buses
      environment: production
      required-build-args: ${{ vars.VITE_REQUIRED_BUILD_ARGS }}
    secrets: inherit
