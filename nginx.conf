server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El mime.types de nginx no incluye .mjs y lo sirve como
    # application/octet-stream. El navegador RECHAZA un modulo con ese tipo,
    # asi que el worker de MapLibre no arranca y las capas GeoJSON --la ruta y
    # las paradas-- no se dibujan nunca, sin ningun error visible.
    #
    # Se acota a los .mjs a proposito: un bloque `types` en el nivel de arriba
    # REEMPLAZA el mapa heredado completo y dejaria el css y el js como
    # octet-stream.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker de los avisos (HU-58).
    #
    # Sin no-cache, un worker viejo sigue atendiendo notificaciones con el codigo
    # anterior y el navegador no avisa de nada. Y tiene que servirse como
    # JavaScript desde la raiz del origen: si el try_files del SPA lo capturara y
    # devolviera el index.html, el registro falla por MIME type y el error es
    # dificil de rastrear.
    location = /firebase-messaging-sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}