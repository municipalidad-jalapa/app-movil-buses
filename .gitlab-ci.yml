include:
  - project: 'municipalidad-jalapa/ci-templates/pipeline-templates'
    ref: main
    file: 'docker-build-push.yml'

variables:
  IMAGE_NAME: "frontend-app-buses"
  ACR_LOGIN_SERVER: "acrbusesjalapa.azurecr.io"

stages:
  - build
  - test
  - package
  - deploy

build:
  stage: build
  image: node:20-alpine
  script:
    - npm install
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test:
  stage: test
  image: node:20-alpine
  script:
    - npm install
    - npx vitest run
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

docker-build-push-qa:
  extends: .docker_build_push_template
  environment:
    name: qa
  variables:
    # SCRUM-310 (HU-138): config publica de Firebase (HU-129/HU-63). Vite
    # las hornea en el bundle al compilar; src/core/config.ts falla al
    # arrancar si faltan.
    REQUIRED_BUILD_ARGS: "VITE_GOOGLE_MAPS_API_KEY VITE_API_BASE_URL VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

docker-build-push-production:
  extends: .docker_build_push_template
  environment:
    name: production
  variables:
    REQUIRED_BUILD_ARGS: "VITE_GOOGLE_MAPS_API_KEY VITE_API_BASE_URL VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-qa:
  stage: deploy
  image:
    name: alpine/kubectl:1.35.3
    entrypoint: [""]
  environment:
    name: qa
  script:
    - kubectl config use-context municipalidad-jalapa/infraestructura/k8s-manifest:aks-buses-dev
    - kubectl set image deployment/$IMAGE_NAME $IMAGE_NAME=$ACR_LOGIN_SERVER/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA -n qa
    - kubectl rollout status deployment/$IMAGE_NAME -n qa --timeout=120s
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'