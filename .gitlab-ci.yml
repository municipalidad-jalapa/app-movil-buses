include:
  - project: 'municipalidad-jalapa/ci-templates/pipeline-templates'
    file: 'docker-build-push.yml'

variables:
  IMAGE_NAME: "frontend-app-buses"

stages:
  - build
  - test
  - package
  - deploy

build:
  stage: build
  image: node:20-alpine
  script:
    - npm install
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test:
  stage: test
  image: node:20-alpine
  script:
    - npm install
    - npx vitest run
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'