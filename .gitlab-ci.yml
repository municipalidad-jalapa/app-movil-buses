include:
  - project: 'municipalidad-jalapa/ci-templates/pipeline-templates'
    ref: main
    file: 'docker-build-push.yml'

stages:
  - build
  - test
  - package
  - deploy

maven-build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn compile
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

maven-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/*.xml
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

docker-build-push:
  extends: .docker_build_push_template

deploy-qa:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: qa
    url: https://qa.buses.jalapa.gob.gt
  script:
    - echo "PLACEHOLDER - Paso 8: aqui ira 'kubectl apply' apuntando al namespace 'qa' del cluster AKS"
    - echo "Por ahora solo simula el despliegue para validar la logica del pipeline"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-production:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://buses.jalapa.gob.gt
  script:
    - echo "PLACEHOLDER - Paso 8: aqui ira 'kubectl apply' apuntando al namespace 'production' del cluster AKS"
    - echo "Por ahora solo simula el despliegue para validar la logica del pipeline"
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'