spring:
  application:
    name: ecoruta-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecoruta}
    username: ${DB_USER:ecoruta}
    password: ${DB_PASSWORD:ecoruta}
  jpa:
    hibernate:
      ddl-auto: validate     # El esquema lo gobierna Flyway, nunca Hibernate
    open-in-view: false
  flyway:
    enabled: true

ecoruta:
  jwt:
    secret: ${JWT_SECRET:cambiar-en-produccion-minimo-32-caracteres!!}
    duracion-minutos: 480
  demanda:
    umbral-salida: 10
    ttl-minutos: 20
    geocerca-metros: 150

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080
