server:
  port: 8080

spring:
  application:
    name: api-buses-jalapa

# Nota para el equipo de backend:
# Cuando se integre PostgreSQL/PostGIS y Firebase, la configuracion de
# conexion (spring.datasource.*) debe leerse desde variables de entorno,
# NUNCA escribirse aqui con valores reales. Esas variables ya estan
# definidas como CI/CD Variables en GitLab (Paso 5): DB_HOST, DB_USER,
# DB_PASSWORD, FIREBASE_PROJECT_ID, etc. Ejemplo de como referenciarlas:
#
# spring:
#   datasource:
#     url: jdbc:postgresql://${DB_HOST}:5432/buses_jalapa
#     username: ${DB_USER}
#     password: ${DB_PASSWORD}
